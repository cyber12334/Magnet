<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #tap-to-play {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); color: white; display: flex;
      justify-content: center; align-items: center; font-family: sans-serif;
      font-size: 20px; z-index: 999; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Phones require a tap to allow video sound -->
  <div id="tap-to-play">Tap Screen to Start Camera & Sound</div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="ar-video" src="./video.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    
      <!-- Adjust height="0.56" if your photo is not 16:9 widescreen -->
      <a-video src="#ar-video" position="0 0 0" height="0.56" width="1"></a-video>
    
  </a-scene>

  <script>
    const overlay = document.getElementById('tap-to-play');
    const video = document.getElementById('ar-video');
    const target = document.getElementById('target');

    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play();
      video.pause();
    });

    target.addEventListener('targetFound', () => { video.play(); });
    target.addEventListener('targetLost', () => { video.pause(); });
  </script>
</body>
</html>
